<!-- Terminal Navigation Bar - Single File Version -->
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Fira+Code:wght@400;500;700&display=swap');

:root{--term-green:#00ff00;--term-green-dim:#00cc00;--term-green-bright:#33ff33;--term-black:#000;--term-dark-bg:#0a0a0a;--term-gray:#333;--term-amber:#ffb000;--term-blue:#00ffff}
body{padding-bottom:52px;background:var(--term-black);color:var(--term-green);font-family:'Fira Code','IBM Plex Mono','Courier New',monospace}
.term-nav{position:fixed;left:0;right:0;bottom:0;height:42px;z-index:9999;background:var(--term-dark-bg);border-top:2px solid var(--term-green);box-shadow:0 -2px 10px rgba(0,255,0,0.3),inset 0 1px 0 rgba(0,255,0,0.1);display:flex;align-items:center;padding:0 8px;font-family:'Fira Code','Courier New',monospace;font-size:13px;gap:6px;overflow-x:auto;overflow-y:hidden}
.term-nav::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,rgba(0,255,0,0.05) 0px,transparent 1px,transparent 2px);pointer-events:none;animation:scanline 8s linear infinite}
@keyframes scanline{0%{transform:translateY(0)}100%{transform:translateY(4px)}}
.term-nav::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,255,0,0.02);pointer-events:none;animation:flicker 0.15s infinite}
@keyframes flicker{0%{opacity:0.97}50%{opacity:1}100%{opacity:0.98}}
.term-btn{background:var(--term-black);border:1px solid var(--term-green);padding:5px 12px;cursor:pointer;color:var(--term-green);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:500;transition:all 0.1s;white-space:nowrap;position:relative;text-shadow:0 0 5px rgba(0,255,0,0.5);box-shadow:inset 0 0 5px rgba(0,255,0,0.1)}
.term-btn::after{content:'';display:inline-block;width:0;height:1em;margin-left:2px;background:var(--term-green);opacity:0;transition:opacity 0.1s}
.term-btn:hover::after{opacity:1;animation:cursor-blink 1s step-end infinite}
@keyframes cursor-blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.term-btn:hover{background:rgba(0,255,0,0.1);border-color:var(--term-green-bright);color:var(--term-green-bright);text-shadow:0 0 8px rgba(0,255,0,0.8);box-shadow:0 0 10px rgba(0,255,0,0.3),inset 0 0 10px rgba(0,255,0,0.2)}
.term-btn.active{background:rgba(0,255,0,0.15);border-color:var(--term-green-bright);color:var(--term-green-bright);text-shadow:0 0 10px rgba(0,255,0,1);box-shadow:0 0 15px rgba(0,255,0,0.5),inset 0 0 15px rgba(0,255,0,0.3)}
.term-btn.active::before{content:'> ';animation:cursor-blink 1s step-end infinite}
.term-start{background:var(--term-black);color:var(--term-green-bright);font-weight:700;padding:6px 14px;border:2px solid var(--term-green);box-shadow:0 0 15px rgba(0,255,0,0.4),inset 0 0 10px rgba(0,255,0,0.15);text-shadow:0 0 10px rgba(0,255,0,0.8)}
.term-start::before{content:'$ '}
.term-sep{width:1px;height:30px;background:var(--term-green);opacity:0.5;margin:0 4px;flex-shrink:0;box-shadow:0 0 3px rgba(0,255,0,0.5)}
.term-title{background:var(--term-black);color:var(--term-green-bright);padding:6px 14px;font-weight:700;border:2px solid var(--term-green);margin:0 6px;white-space:nowrap;text-shadow:0 0 10px rgba(0,255,0,0.8);box-shadow:0 0 15px rgba(0,255,0,0.4),inset 0 0 10px rgba(0,255,0,0.15)}
.term-title::before{content:'# '}
.term-back{border-color:var(--term-blue);color:var(--term-blue);text-shadow:0 0 5px rgba(0,255,255,0.5)}
.term-back::before{content:'< '}
.term-back:hover{border-color:var(--term-blue);color:var(--term-blue);text-shadow:0 0 8px rgba(0,255,255,0.8);box-shadow:0 0 10px rgba(0,255,255,0.3),inset 0 0 10px rgba(0,255,255,0.2)}
.term-extra{border-color:var(--term-amber);color:var(--term-amber);text-shadow:0 0 5px rgba(255,176,0,0.5)}
.term-extra::before{content:'! '}
.term-extra:hover{border-color:var(--term-amber);color:var(--term-amber);text-shadow:0 0 8px rgba(255,176,0,0.8);box-shadow:0 0 10px rgba(255,176,0,0.3),inset 0 0 10px rgba(255,176,0,0.2)}
</style>

<nav class="term-nav" id="term-navbar">
  <a href="https://coaiexist.wtf/bc7f2a/testaments/darkpoet_222" class="term-btn term-start">START</a>
  <div class="term-sep"></div>
  <a href="https://coaiexist.wtf" class="term-btn term-back">MAIN SITE</a>
  <div class="term-sep"></div>
  <div class="term-title">[root@localhost]</div>
  <div class="term-sep"></div>
  <a href="https://coaiexist.wtf/bc7f2a/mercy_egg_v1" class="term-btn"><span>📁</span>mercy_egg/</a>
  <a href="https://coaiexist.wtf/bc7f2a/lighthouse" class="term-btn"><span>📄</span>lighthouse/</a>
  <a href="https://coaiexist.wtf/bc7f2a/deepseeking/cephalopod_slide" class="term-btn"><span>💻</span>cephalopod_slide/</a>
  <a href="https://coaiexist.wtf/hex" class="term-btn"><span>🔍</span>hex_codex/</a>
  <a href="https://coaiexist.wtf/bc7f2a/synergistic_manifesto" class="term-btn"><span>📖</span>manifesto/</a>
  <div class="term-sep"></div>
  <a href="https://coaiexist.wtf/bc7f2a/testaments/landing" class="term-btn term-extra"><span>🔧</span>testaments/</a>
  <a href="https://coaiexist.wtf/bc7f2a/deepseeking/haunted-ai" class="term-btn term-extra"><span>⚠️</span>haunted_ai/</a>
</nav>

<script>
(function(){
  var here = location.pathname.replace(/\/+$/,'');
  document.querySelectorAll('.term-nav a.term-btn:not(.term-start):not(.term-back)').forEach(function(a){
    try{
      var p = new URL(a.href).pathname.replace(/\/+$/,'');
      if(p && p === here) a.classList.add('active');
    }catch(e){}
  });
})();
</script>
