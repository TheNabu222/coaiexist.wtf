<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
    <style>
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Button Test</h1>
    <button id="test-btn">Click Me!</button>
    <p id="result"></p>

    <script>
        document.getElementById('test-btn').addEventListener('click', () => {
            document.getElementById('result').textContent = 'Button works!';
            alert('Success!');
        });
    </script>
</body>
</html>
